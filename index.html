<style>

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.g-tier{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.g-fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.g-zoom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.g-hall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.chk{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green);cursor:pointer}

.po{display:none}

.scroll{position:relative}
.ferr{display:block;font-size:13px;font-weight:600;color:var(--red);margin-top:6px;line-height:1.35}
.inp[aria-invalid=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}

@media print{
@page{size:A4 landscape;margin:10mm}
.pg.light,.pg.dark{--bg:#FFFFFF;--paper:#FFFFFF;--cell:#F1F4F1;--cellb:#C9D1CA;--ink:#111111;--ink2:#444444;--green:#1C5A3F;--gink:#FFFFFF;--gsoft:#EDF3EE;--rule:#D3D9D4;--rule2:#9AA39C;--red:#B0251C;background:#FFFFFF;font-size:12px}

<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Trang cần bật JavaScript để chạy bảng tính và form đăng ký.</p></noscript>

</a>

</button>
</div>
</div>
</header>


<section id="top" class="wrap np" style="padding-top: 56px; padding-bottom: 56px">
<div class="g-hero">

<p class="disp" style="font-size: 30px; line-height: 1.2; font-style: italic; font-weight: 500; margin-top: -4px">Xây dựng kế hoạch thuế phải nộp 2027</p>
<p style="font-size: 18px; line-height: 1.65; max-width: 640px; color: var(--ink)">Năm 2027 anh chị muốn có bao nhiêu tiền sau thuế? Điền con số đó vào bảng bên dưới. Bảng sẽ tính ngược ra doanh thu cần đạt, chi phí được phép tiêu, số sản phẩm phải bán mỗi ngày và số thuế phải nộp.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px">
<a href="#bang-tinh" class="btn pri">Tính số tiền muốn có
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
</a>
<a href="#dang-ky" class="btn sec">Đăng ký vào nhóm Zalo</a>
</div>

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

      vatOutF: this.f(vatOut), vatInF: this.f(vatIn), vatMF: this.f(vatM)
    };

    const isY = st.period !== 'month', mul = isY ? 12 : 1;
    const per = {
      label: isY ? 'cả năm 2027' : 'mỗi tháng',
      labelUp: isY ? 'CẢ NĂM 2027' : 'MỖI THÁNG NĂM 2027', qLead: isY ? 'Năm 2027' : 'Mỗi tháng năm 2027',
      yCls: isY ? 'seg on' : 'seg', mCls: isY ? 'seg' : 'seg on',
      yPressed: isY ? 'true' : 'false', mPressed: isY ? 'false' : 'true',
      setY: () => this.setState({ period: 'year' }), setM: () => this.setState({ period: 'month' }),
      lnstS: this.s(S.lnst * mul), dtS: this.s(S.dt * mul), cpS: this.s(S.cp * mul), lnttS: this.s(S.lntt * mul),
      lnstF: this.f(S.lnst * mul), lnttF: this.f(S.lntt * mul), thueF: this.f(S.thue * mul), thueS: this.s(S.thue * mul),
      vatOutF: this.f(vatOut * mul), vatInF: this.f(vatIn * mul), vatF: this.f(vatM * mul), vatS: this.s(vatM * mul),

    };
    const b02 = [
      { code: '01', label: 'Doanh thu', m: this.f(S.dt), y: this.f(S.dt * 12), cls: '' },
      { code: '11+25+26', label: 'Chi phí', m: this.f(S.cp), y: this.f(S.cp * 12), cls: '' },
      { code: '50', label: 'Lợi nhuận trước thuế', m: this.f(S.lntt), y: this.f(S.lntt * 12), cls: 'b' },
      { code: '51', label: 'Thuế TNDN', m: this.f(S.thue), y: this.f(thueY), cls: 'red' },
      { code: '60', label: 'Lợi nhuận sau thuế', m: this.f(S.lnst), y: this.f(S.lnst * 12), cls: 'b dbl' }
    ];

    // Gợi ý thuế suất
    const has26 = st.dt2026 > 0;
    const base = has26 ? st.dt2026 : S.dt * 12;
    const band = rate === 15 ? 'không quá 3 tỷ' : (rate === 17 ? 'trên 3 tỷ đến 50 tỷ' : 'trên 50 tỷ');
    const hint = {
      text: !rateKnown ? 'Tổng chi phí đang vượt 95% doanh thu nên chưa tính được doanh thu và chưa xác định được thuế suất. Có doanh thu năm 2026 thì điền vào ô bên cạnh để xác định thuế suất.'
        : st.rel
        ? 'Doanh nghiệp là công ty con hoặc có quan hệ liên kết với doanh nghiệp không thuộc diện 15%, 17%, nên bảng áp dụng thuế suất 20% (Điều 11 Nghị định 320/2025/NĐ-CP), dù ' + (has26 ? 'doanh thu năm 2026 là ' : 'doanh thu kế hoạch cả năm 2027 là ') + this.s(base) + '.'
        : (has26 ? 'Doanh thu năm 2026 là ' : 'Doanh thu kế hoạch cả năm 2027 là ') + this.s(base) + ', ' + band + ', nên bảng tự áp dụng thuế suất ' + rate + '%.' + (has26 ? '' : ' Khi có doanh thu năm 2026, điền vào ô bên cạnh để tính đúng theo năm liền trước.')
    };

    const tndnOpts = [[15, 'doanh thu ≤ 3 tỷ'], [17, 'trên 3 đến 50 tỷ'], [20, 'trên 50 tỷ']].map(o => ({
      label: o[0] + '%', sub: o[1], cls: rateKnown && rate === o[0] ? 'seg on' : 'seg', bg: rateKnown && rate === o[0] ? 'var(--green)' : 'var(--paper)'
    }));
    const vatOpts = [0, 5, 8, 10].map(x => ({
      label: x + '%', cls: st.vat === x ? 'seg on' : 'seg', pressed: st.vat === x ? 'true' : 'false',
      pick: () => this.setState({ vat: x })
    }));

    // B02-DN theo tháng
    // Khóa tháng chỉ giữ 4 dòng doanh nghiệp làm ra: doanh thu, giá vốn, bán hàng, quản lý.
    // Lợi nhuận và thuế luôn tính lại theo thuế suất, tỷ lệ hóa đơn đang chọn (thuế suất là của cả năm).
    const lockArr = st.lock || new Array(12).fill(null);
    const KEYS = ['L01', 'L11', 'L25', 'L26'];
    const BASE = { L01: S.dt * 12, L11: S.gv * 12, L25: S.bh * 12, L26: S.ql * 12 };
    const lockedSum = { L01: 0, L11: 0, L25: 0, L26: 0 };
    let nLocked = 0, nOpen = 0, wOpen = 0;
    st.season.forEach((w, i) => {
      const sn = lockArr[i];
      if (sn) { nLocked++; KEYS.forEach(k => { lockedSum[k] += sn[k]; }); }
      else { nOpen++; wOpen += Number(w) || 0; }
    });
    const over = nLocked > 0 && lockedSum.L01 > BASE.L01 + 0.5;
    const COSTLBL = { L11: 'giá vốn', L25: 'chi phí bán hàng', L26: 'chi phí quản lý' };
    const costOver = (over || nOpen === 0) ? [] : ['L11', 'L25', 'L26'].filter(k => lockedSum[k] > BASE[k] + 0.5);
    const baseM = st.season.map((w, i) => {
      const sn = lockArr[i];
      if (sn) return { L01: sn.L01, L11: sn.L11, L25: sn.L25, L26: sn.L26 };
      const sh = wOpen > 0 ? (Number(w) || 0) / wOpen : (nOpen > 0 ? 1 / nOpen : 0);
      const pick = k => { const r = BASE[k] - lockedSum[k]; return (over || (BASE[k] >= 0 && r < 0) ? 0 : r) * sh; };
      return { L01: pick('L01'), L11: pick('L11'), L25: pick('L25'), L26: pick('L26') };
    });
    this._months = baseM;
    // TNDN tính lũy kế từ đầu năm và không âm: tháng lỗ được trừ vào lãi các tháng khác trong năm.
    // Dòng 51 tháng = thuế trên lợi nhuận lũy kế đến tháng này − thuế lũy kế đến tháng trước.
    let cumP = 0, cumTax = 0;
    const months = baseM.map(b => {
      const L01 = b.L01, L11 = b.L11, L25 = b.L25, L26 = b.L26;
      const L20 = L01 - L11, L30 = L20 - L25 - L26, L50 = L30;
      cumP += L50;
      const tx = Math.max(0, cumP) * t, L51 = tx - cumTax;
      cumTax = tx;
      const L60 = L50 - L51;
      // GTGT phát sinh trong tháng = đầu ra − đầu vào, có thể âm
      const vat = L01 * v - (L11 + L25 + L26) * ip * v;
      return { L01, L02: 0, L10: L01, L11, L20, L22: 0, L23: 0, L25, L26, L30, L40: 0, L50, L51, L60, vat };
    });
    const lockWarn = over
      ? 'Các tháng đã khóa đã vượt doanh thu mục tiêu cả năm, nên các tháng chưa khóa được tính bằng 0. Mở khóa bớt một tháng hoặc tăng mục tiêu.'
      : (nLocked === 12 ? 'Đã khóa cả 12 tháng nên sửa % hoàn thành không còn đổi số liệu. Mở khóa một tháng để tính lại.'
        : (costOver.length ? 'Các tháng đã khóa đã tiêu ' + costOver.map(k => COSTLBL[k]).join(', ') + ' vượt ngân sách cả năm, nên các tháng chưa khóa được tính khoản này bằng 0 và lợi nhuận các tháng đó cao bất thường. Mở khóa bớt một tháng hoặc tăng mức chi phí ở bảng sản phẩm, Khối 3.' : ''));
    const defs = [
      ['01', 'Doanh thu bán hàng và cung cấp dịch vụ', 'L01', ''],
      ['02', 'Các khoản giảm trừ doanh thu', 'L02', 'mu'],
      ['10', 'Doanh thu thuần', 'L10', 'b'],
      ['11', 'Giá vốn hàng bán', 'L11', ''],
      ['20', 'Lợi nhuận gộp', 'L20', 'b'],
      ['22', 'Chi phí tài chính', 'L22', 'mu'],
      ['23', 'Trong đó: Chi phí lãi vay', 'L23', 'mu it'],
      ['25', 'Chi phí bán hàng', 'L25', ''],
      ['26', 'Chi phí quản lý doanh nghiệp', 'L26', ''],
      ['30', 'Lợi nhuận thuần từ hoạt động kinh doanh', 'L30', 'b'],
      ['40', 'Lợi nhuận khác', 'L40', 'mu'],
      ['50', 'Tổng lợi nhuận kế toán trước thuế', 'L50', 'b'],
      ['51', 'Chi phí thuế TNDN hiện hành', 'L51', 'red'],
      ['60', 'Lợi nhuận sau thuế TNDN', 'L60', 'b dbl']
    ];
    const b02m = defs.map(d => {
      let sum = 0;
      const cells = months.map((m, i) => { sum += m[d[2]]; return { v: this.fz(m[d[2]]), cls: lockArr[i] ? 'lkd' : '' }; });
      return { code: d[0], label: d[1], cls: d[3], cells: cells, y: this.fz(sum) };
    });
    const vatCells = months.map((m, i) => ({ v: this.f(m.vat), cls: lockArr[i] ? 'lkd' : '' }));
    const vatYm = months.reduce((a, m) => a + m.vat, 0);
    const monthHeads = months.map((m, i) => ({ l: 'T' + (i + 1), cls: lockArr[i] ? 'lkd' : '' }));
    const seasonCells = st.season.map((w, i) => ({
      l: 'T' + (i + 1), v: String(w), locked: !!lockArr[i], cls: lockArr[i] ? 'lkd' : '',
      set: e => { const s = this.state.season.slice(); s[i] = Math.min(this.dig(e.target.value), 999); this.setState({ season: s }); },
      lkCls: lockArr[i] ? 'lk on' : 'lk', lkLabel: lockArr[i] ? 'Đã khóa' : 'Khóa', lkPressed: lockArr[i] ? 'true' : 'false',
      lkAria: (lockArr[i] ? 'Mở khóa tháng ' : 'Khóa tháng ') + (i + 1),
      toggle: () => { if (badAny) return; const lk = this.state.lock.slice(); lk[i] = lk[i] ? null : Object.assign({}, this._months[i]); this.setState({ lock: lk }); }
    }));
    // Bản in: tách bảng 12 tháng thành 2 nửa năm cho vừa khổ A4 ngang
    const b02h = [[0, 6], [6, 12]].map((h, hi) => ({
      title: hi === 0 ? 'Tháng 1 – tháng 6' : 'Tháng 7 – tháng 12 và cả năm',
      heads: monthHeads.slice(h[0], h[1]), season: seasonCells.slice(h[0], h[1]), vat: vatCells.slice(h[0], h[1]), last: hi === 1,
      rows: b02m.map(r => ({ code: r.code, label: r.label, cls: r.cls, cells: r.cells.slice(h[0], h[1]), y: r.y }))
    }));
    // Kỳ kê khai GTGT: doanh thu năm trước liền kề trên 50 tỷ thì khai theo tháng, còn lại theo quý (Điều 19 TT 89/2026/TT-BTC)
    const vatMonthly = (has26 ? st.dt2026 : S.dt * 12) > 50e9;
    // GTGT phải nộp theo từng kỳ kê khai: kỳ nào đầu vào lớn hơn đầu ra thì phần dư được khấu trừ chuyển kỳ sau
    let credit = 0;
    const payVat = net => { const x = net - credit; if (x >= 0) { credit = 0; return x; } credit = -x; return 0; };
    // TNDN tạm nộp quý = thuế trên lợi nhuận lũy kế đến cuối quý − số đã tạm nộp các quý trước, không âm
    let paid = 0, cumQ = 0;
    const q = [0, 1, 2, 3].map(qi => {
      const ms = months.slice(qi * 3, qi * 3 + 3);
      let va = 0;
      if (vatMonthly) ms.forEach(m => { va += payVat(m.vat); });
      else va = payVat(ms.reduce((a, m) => a + m.vat, 0));
      ms.forEach(m => { cumQ += m.L50; });
      const tn = Math.max(0, Math.max(0, cumQ) * t - paid);
      paid += tn;
      return { va, tn };
    });
    const qy = q.reduce((a, b) => ({ va: a.va + b.va, tn: a.tn + b.tn }), { va: 0, tn: 0 });
    const qrows = [
      { label: vatMonthly ? 'Thuế GTGT phải nộp (khai theo tháng, cộng 3 tháng)' : 'Thuế GTGT phải nộp', cls: '', cells: q.map(x => ({ v: this.f(x.va) })), y: this.f(qy.va) },
      { label: 'Thuế TNDN tạm nộp', cls: '', cells: q.map(x => ({ v: this.f(x.tn) })), y: this.f(qy.tn) },
      { label: 'Tổng thuế phải nộp', cls: 'b dbl', cells: q.map(x => ({ v: this.f(x.va + x.tn) })), y: this.f(qy.va + qy.tn) }
    ];
    const qNotes = [
      (vatMonthly ? 'Doanh thu năm trước liền kề trên 50 tỷ nên khai thuế GTGT theo tháng; dòng GTGT là tổng 3 tháng của quý.' : 'Doanh thu năm trước liền kề từ 50 tỷ trở xuống nên khai thuế GTGT theo quý.') + (has26 ? '' : ' Chưa có doanh thu 2026 nên tạm xác định theo doanh thu kế hoạch 2027.'),
      'Quý lỗ không phải tạm nộp thuế TNDN; lỗ được trừ vào lãi các quý sau trong năm. Kỳ nào thuế GTGT đầu vào lớn hơn đầu ra thì phần dư được khấu trừ sang kỳ sau.'
    ];
    if (credit > 0.5) qNotes.push('Cuối năm còn ' + this.f(credit) + ' đồng thuế GTGT đầu vào chưa khấu trừ hết, được chuyển sang năm 2028.');
    if (paid > cumTax + 0.5) qNotes.push('Tạm nộp 4 quý cao hơn thuế TNDN cả năm ' + this.f(paid - cumTax) + ' đồng; phần nộp thừa được bù trừ khi quyết toán.');
    const badText = !badAny ? '' : 'Tổng chi phí của ' + badRows.map(r => r.name + ' là ' + r.totF).join(', ') + ' doanh thu, vượt mức tối đa 95% của bảng tính' +
      (badRows.some(r => r.tot >= 100) ? ': bán bao nhiêu cũng lỗ' : '') + ', nên không tính được doanh thu để đạt lãi ' + per.lnstS + ' ' + per.label +
      '. Giảm giá vốn hoặc chi phí bán hàng ở Khối 3 (Chi tiết theo BCTC), hoặc giảm % chi phí ở bảng sản phẩm.';

    // ===== Tầng Khách hàng: các đòn bẩy doanh số tính ngược từ tầng Tài chính (cả năm) =====
    const fwS = st.fw;
    const pn = x => { const v = parseFloat(String(x).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? v : 0; };
    const Ry = S.dt * 12, Qy = S.qx * 12, avgP = Qy > 0 ? Ry / Qy : 0, margin = Ry > 0 ? (S.lnst * 12) / Ry : 0;
    const iL = this.dig(fwS.leads), iC = pn(fwS.cr) / 100, iN = pn(fwS.n), iI = pn(fwS.items);
    const fm = fwS.mode;
    let L = iL, C = iC, N = iN, I = iI, cust, orders;
    if (fm === 'leads') { orders = I > 0 ? Qy / I : 0; cust = N > 0 ? orders / N : 0; L = C > 0 ? cust / C : 0; }
    else if (fm === 'cr') { orders = I > 0 ? Qy / I : 0; cust = N > 0 ? orders / N : 0; C = L > 0 ? cust / L : 0; }
    else if (fm === 'n') { cust = L * C; orders = I > 0 ? Qy / I : 0; N = cust > 0 ? orders / cust : 0; }
    else { cust = L * C; orders = cust * N; I = orders > 0 ? Qy / orders : 0; }
    const up = x => Math.ceil(x - 1e-9);
    const asv = avgP * I;
    const wd = days * 12;
    const setFw = key => e => this.setState({ fw: Object.assign({}, this.state.fw, { [key]: e.target.value }) });
    const lever = (key, op, label, sub, out) => {
      const solved = fm === key;
      return { op, label, sub, isIn: !solved, isOut: solved, solved, raw: fwS[key], set: setFw(key), val: out, cls: solved ? 'solved key' : '' };
    };
    const auto = (op, label, sub, val, cls) => ({ op, label, sub, isIn: false, isOut: true, solved: false, raw: '', set: null, val, cls: cls || '' });
    const noQ = !(Qy > 0), dq = x => noQ ? '–' : x;
    const fwRows = [
      lever('leads', '', 'Khách tiềm năng', 'Người quan tâm, có thể tiếp cận', dq(this.f(up(L)) + ' người')),
      lever('cr', '×', 'Tỷ lệ chốt đơn', 'Phần trăm khách tiềm năng mua hàng', dq(this.d1(C * 100) + '%')),
      auto('=', 'Số khách mua', 'Khách tiềm năng × tỷ lệ chốt', dq(this.f(up(cust)) + ' khách'), 'key'),
      lever('n', '×', 'Số lần mua của 1 khách / năm', 'Chăm sóc sau bán, khách quay lại', dq(this.d1(N) + ' lần')),
      auto('=', 'Số đơn hàng', 'Số khách × số lần mua', dq(this.f(up(orders)) + ' đơn'), 'key'),
      lever('items', '×', 'Số sản phẩm / đơn', 'Bán thêm, bán kèm', dq(this.d1(I) + ' sản phẩm')),
      auto('=', 'Số sản phẩm cần bán', 'Khớp với bảng sản phẩm phía trên', dq(this.f(up(Qy)) + ' sản phẩm'), 'key'),
      auto('×', 'Đơn giá trung bình 1 sản phẩm', 'Doanh thu ÷ số sản phẩm · giá trị 1 đơn ' + dq(this.s(asv)), dq(this.f(avgP))),
      auto('=', 'Doanh thu', 'Khớp doanh thu cần đạt ở tầng Tài chính', this.f(Ry), 'key ok'),
      auto('×', 'Biên lợi nhuận (LNST / doanh thu)', 'Lấy từ bảng tính', Ry > 0 ? (margin * 100).toFixed(2).replace('.', ',') + '%' : '–'),
      auto('=', 'Lợi nhuận sau thuế', 'Khớp tiền muốn có ở tầng Tài chính', this.f(Ry * margin), 'key ok tot last')
    ];
    // Ví dụ: đổi một ô đang điền, xem ô tính ngược thay đổi thế nào (theo đúng số trên bảng)
    const solveFw = (mode, l, c, n, it) => {
      let o, cu;
      if (mode === 'leads') { o = it > 0 ? Qy / it : 0; cu = n > 0 ? o / n : 0; return c > 0 ? cu / c : 0; }
      if (mode === 'cr') { o = it > 0 ? Qy / it : 0; cu = n > 0 ? o / n : 0; return l > 0 ? cu / l : 0; }
      if (mode === 'n') { cu = l * c; o = it > 0 ? Qy / it : 0; return cu > 0 ? o / cu : 0; }
      cu = l * c; o = cu * n; return o > 0 ? Qy / o : 0;
    };
    const FWLBL = { leads: 'khách tiềm năng', cr: 'tỷ lệ chốt', n: 'số lần mua mỗi năm', items: 'số sản phẩm mỗi đơn' };
    const fwFmt = (k, x) => k === 'leads' ? this.f(up(x)) + ' người' : k === 'cr' ? this.d1(x * 100) + '%' : k === 'n' ? this.d1(x) + ' lần' : this.d1(x) + ' sản phẩm';
    const cur = { leads: L, cr: C, n: N, items: I };
    const bump = { leads: x => Math.round(x * 1.2), cr: x => x + 0.05, n: x => x + 1, items: x => x + 1 };
    const examples = [];
    ['leads', 'cr', 'n', 'items'].forEach(k => {
      if (k === fm || !(cur[k] > 0) || !(Qy > 0)) return;
      const nx = Object.assign({}, cur, { [k]: bump[k](cur[k]) });
      const a = solveFw(fm, cur.leads, cur.cr, cur.n, cur.items), b = solveFw(fm, nx.leads, nx.cr, nx.n, nx.items);
      if (!(a > 0) || !(b > 0)) return;
      const up1 = k === 'leads' ? 'thêm 20%, ' : '';
      examples.push({ t: 'Tăng ' + FWLBL[k] + ' ' + up1 + 'từ ' + fwFmt(k, cur[k]) + ' lên ' + fwFmt(k, nx[k]) + ': ' + FWLBL[fm] + ' cần ' + (b < a ? 'giảm' : 'tăng') + ' từ ' + fwFmt(fm, a) + (b < a ? ' xuống ' : ' lên ') + fwFmt(fm, b) + '.' });
    });
    examples.push({ t: 'Tăng lợi nhuận muốn có ở bảng sản phẩm phía trên: số sản phẩm cần bán, doanh thu và ' + FWLBL[fm] + ' đều tăng theo.' });
    const warns = [];
    if (C > 1) warns.push('Tỷ lệ chốt cần đạt vượt 100%: phải có thêm khách tiềm năng hoặc tăng số lần mua, số sản phẩm mỗi đơn.');
    if (fm !== 'leads' && fm !== 'cr' && N > 0 && N < 1) warns.push('Số lần mua dưới 1 lần: số khách đang nhiều hơn số đơn cần bán.');
    if (fm === 'items' && I > 0 && I < 1) warns.push('Số sản phẩm mỗi đơn dưới 1: số đơn đang nhiều hơn số sản phẩm cần bán.');
    if (Qy <= 0) warns.push('Chưa có giá bán ở bảng sản phẩm nên chưa tính được đơn giá trung bình.');
    const FWIND = [
      ['tu', 'Tự điền', null, null], ['bl', 'Bán lẻ, thương mại', 30, 6], ['sx', 'Sản xuất, phân phối', 15, 4],
      ['dv', 'Dịch vụ', 25, 3], ['an', 'Nhà hàng, ăn uống', 60, 12], ['xd', 'Xây dựng, dự án', 10, 1]
    ];
    const fw = {
      ind: fwS.ind, rows: fwRows, hasWarn: warns.length > 0, warn: warns.join(' '), examples: examples, solvedLabel: FWLBL[fm],
      inds: FWIND.map(o => ({ id: o[0], label: o[2] == null ? o[1] : o[1] + ' · chốt ' + o[2] + '%, mua ' + o[3] + ' lần/năm' })),
      setInd: e => { const id = e.target.value; const o = FWIND.find(x => x[0] === id); const patch = { ind: id }; if (o && o[2] != null) { patch.cr = String(o[2]); patch.n = String(o[3]); } this.setState({ fw: Object.assign({}, this.state.fw, patch) }); },
      modes: [['leads', 'Khách tiềm năng'], ['cr', 'Tỷ lệ chốt'], ['n', 'Số lần mua'], ['items', 'Sản phẩm/đơn']].map(m => ({
        label: m[1], cls: fm === m[0] ? 'seg on' : 'seg', pressed: fm === m[0] ? 'true' : 'false',
        pick: () => this.setState({ fw: Object.assign({}, this.state.fw, { mode: m[0] }) })
      })),
      note: badAny ? 'Tổng chi phí vượt 95% doanh thu nên chưa tính được số khách, số đơn.' : noQ ? 'Chưa có giá bán ở bảng sản phẩm nên chưa quy ra được số khách, số đơn mỗi tháng.' : 'Quy ra mỗi tháng: ' + this.f(up(L / 12)) + ' khách tiềm năng, ' + this.f(up(orders / 12)) + ' đơn. Số người, số đơn làm tròn lên; mỗi tháng đều làm tròn lên nên 12 tháng cộng lại có thể nhỉnh hơn số cả năm.'
    };
    // Ví dụ đọc bản đồ theo số đang có
    const mapEx = { lnst: this.s(S.lnst * 12), dt: this.s(Ry), qty: this.f(up(Qy)), cust: this.f(up(cust)), leads: this.f(up(L)), cr: this.d1(C * 100) + '%', leadsDay: this.d1(L / wd) };
    // ===== Tầng Quy trình và Con người: danh sách tick chọn =====
    const gvPct = S.dt > 0 ? this.pc(S.gv / S.dt) : '–', bhPct = S.dt > 0 ? this.pc(S.bh / S.dt) : '–', qlPct = S.dt > 0 ? this.pc(S.ql / S.dt) : '–';
    const GDEF = {
      sales: ['Quy trình tạo doanh số', 'Mỗi đòn bẩy doanh số cần một quy trình', [
        ['s1', 'Marketing tạo khách tiềm năng', this.f(up(L)) + ' người/năm, khoảng ' + this.f(up(L / 12)) + ' người/tháng'],
        ['s2', 'Tư vấn và chốt đơn', 'Đạt tỷ lệ chốt ' + this.d1(C * 100) + '%'],
        ['s3', 'Bán thêm, bán kèm', this.d1(I) + ' sản phẩm/đơn, giá trị đơn ' + this.s(asv)],
        ['s4', 'Chăm sóc sau bán, giữ khách', 'Mỗi khách mua ' + this.d1(N) + ' lần/năm'],

      cost: ['Quy trình quản trị chi phí', 'Vận hành và quản trị chi phí đúng tỷ lệ đã đặt', [
        ['c1', 'Lập ngân sách chi phí tháng', 'Tối đa ' + this.s(S.cp) + '/tháng, bằng ' + k.cpPct + ' doanh thu'],
        ['c2', 'Kiểm soát giá vốn khi mua hàng', 'Giá vốn không quá ' + gvPct + ' doanh thu'],
        ['c3', 'Duyệt chi bán hàng và quản lý theo ngân sách', 'Bán hàng ' + bhPct + ', quản lý ' + qlPct + ' doanh thu'],
        ['c4', 'Thu đủ hóa đơn đầu vào', st.inPct + '% chi phí có hóa đơn GTGT'],
        ['c5', 'Lập lịch tiền nộp thuế', 'GTGT bình quân ' + this.s(vatM) + '/tháng, TNDN bình quân ' + this.s(S.thue * 3) + '/quý, từng quý xem Khối 5'],
        ['c6', 'Theo dõi dòng tiền, công nợ hằng tuần', 'Lãi chưa chắc có tiền']
      ]],
      trainOwner: ['Chủ doanh nghiệp', 'Ra quyết định bằng con số', [
        ['t4', 'Chủ doanh nghiệp đọc số cùng kế toán', 'Họp số liệu mỗi tuần']
      ]],
      trainSales: ['Người bán hàng', 'Kỹ năng để đạt các đòn bẩy doanh số', [
        ['t1', 'Kỹ năng tư vấn, chốt đơn cho người bán hàng', 'Để đạt tỷ lệ chốt ' + this.d1(C * 100) + '%'],
        ['t2', 'Chăm sóc khách hàng, bán thêm, bán kèm', 'Để khách mua ' + this.d1(N) + ' lần/năm, ' + this.d1(I) + ' sản phẩm/đơn']
      ]],
      trainAcc: ['Kế toán', 'Làm được báo cáo và kế hoạch thuế', [
        ['t3', 'Kế toán đọc báo cáo và lập kế hoạch thuế', 'B02-DN, thuế TNDN, thuế GTGT theo quý']
      ]],
      dmoOwner: ['Chủ doanh nghiệp', 'Mỗi sáng', [
        ['o1', 'Xem doanh thu hôm qua so với mục tiêu', this.s(S.dt / days) + '/ngày'],
        ['o2', 'Xem số đơn đã chốt', this.d1(orders / wd) + ' đơn/ngày'],
        ['o3', 'Duyệt chi trong ngân sách', 'Bình quân ' + this.s(S.cp / days) + '/ngày']
      ]],
      dmoSales: ['Người bán hàng', 'Mỗi ngày', [
        ['b1', 'Tiếp cận khách tiềm năng mới', this.d1(L / wd) + ' người/ngày'],
        ['b2', 'Chốt đơn', this.d1(orders / wd) + ' đơn/ngày, ' + this.d1(Qy / wd) + ' sản phẩm/ngày'],
        ['b3', 'Gọi lại khách cũ để bán lại, bán thêm', 'Theo danh sách chăm sóc'],
        ['b4', 'Ghi khách tiềm năng và kết quả vào sổ', 'Cuối ngày']
      ]],
      dmoAcc: ['Kế toán', 'Mỗi ngày', [
        ['a1', 'Ghi nhận doanh thu, chi phí trong ngày', 'Cuối ngày'],
        ['a2', 'Đối chiếu hóa đơn đầu vào', 'Giữ đủ ' + st.inPct + '% chi phí có hóa đơn'],
        ['a3', 'Cập nhật chi phí so với ngân sách', 'Ngân sách ' + this.s(S.cp) + '/tháng'],
        ['a4', 'Báo số liệu ngày cho chủ', 'Doanh thu, số đơn, tiền mặt']
      ]]
    };
    const mkGroup = key => {
      const d = GDEF[key], off = st.off, cus = st.custom[key] || [], gone = st.gone || {};
      const goneIds = d[2].filter(it => gone[it[0]]).map(it => it[0]);
      const row = (id, title, metric, custom) => ({
        uid: 'ck-' + (phone ? 'm-' : '') + id, title, metric, custom, on: !off[id], cls: off[id] ? 'unchk' : '',
        toggle: () => this.setState({ off: Object.assign({}, this.state.off, { [id]: !this.state.off[id] }) }),
        remove: () => custom
          ? this.setState({ custom: Object.assign({}, this.state.custom, { [key]: (this.state.custom[key] || []).filter(c => c.id !== id) }) })
          : this.setState({ gone: Object.assign({}, this.state.gone, { [id]: true }) })
      });
      return {
        title: d[0].toUpperCase(), sub: d[1],
        items: d[2].filter(it => !gone[it[0]]).map(it => row(it[0], it[1], it[2], false)).concat(cus.map(c => row(c.id, c.text, 'Việc tự thêm', true))),
        hasGone: goneIds.length > 0, goneLabel: 'Khôi phục ' + goneIds.length + ' việc đã xóa',
        restore: () => { const g2 = Object.assign({}, this.state.gone); goneIds.forEach(x => { delete g2[x]; }); this.setState({ gone: g2 }); },
        ph: 'Thêm việc khác…', draft: st.drafts[key] || '',
        setDraft: e => this.setState({ drafts: Object.assign({}, this.state.drafts, { [key]: e.target.value }) }),
        add: () => {
          const t = String(this.state.drafts[key] || '').trim(); if (!t) return;
          const id = 'u' + this.state.cid;
          this.setState({ cid: this.state.cid + 1, drafts: Object.assign({}, this.state.drafts, { [key]: '' }),
            custom: Object.assign({}, this.state.custom, { [key]: (this.state.custom[key] || []).concat([{ id, text: t }]) }) });
        }
      };
    };
    const procGroups = ['sales', 'cost'].map(mkGroup), trainGroups = ['trainOwner', 'trainSales', 'trainAcc'].map(mkGroup), dmoGroups = ['dmoOwner', 'dmoSales', 'dmoAcc'].map(mkGroup);
    const now = new Date();
    const rep = {
      biz: st.form.biz || '……………………', name: st.form.name || '……………………',
      date: String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear()
    };

    // Đăng ký
    const form = st.form;
    const fs = {};
    ['name', 'email', 'phone', 'biz', 'website'].forEach(key => {
      fs[key] = e => this.setState({ form: Object.assign({}, this.state.form, { [key]: e.target.value }), err: '' });
    });
    const roles = ['Chủ doanh nghiệp', 'Kế toán', 'Khác'].map(r => ({
      label: r, cls: form.role === r ? 'seg on' : 'seg', pressed: form.role === r ? 'true' : 'false',
      pick: () => this.setState({ form: Object.assign({}, this.state.form, { role: r }), err: '' })
    }));
    const normPhone = v => {
      let d = String(v || '').replace(/[^\d+]/g, '');
      if (d.indexOf('+84') === 0) d = '0' + d.slice(3);
      else if (d.indexOf('84') === 0 && d.length === 11) d = '0' + d.slice(2);
      return d.replace(/\D/g, '');
    };
    const chk = f => {
      const e = { name: '', email: '', phone: '', role: '', consent: '' };
      if (!String(f.name).trim()) e.name = 'Cần điền họ và tên.';
      const em = String(f.email).trim();
      if (!em) e.email = 'Cần điền email.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) e.email = 'Email chưa đúng, ví dụ: ten@congty.vn';
      const ph = normPhone(f.phone);
      if (!ph) e.phone = 'Cần điền số điện thoại Zalo.';
      else if (!/^0[35789]\d{8}$/.test(ph)) e.phone = 'Số điện thoại chưa đúng, cần 10 số, ví dụ: 0912 345 678';
      if (!f.role) e.role = 'Chọn một vai trò.';
      if (!f.consent) e.consent = 'Cần tích đồng ý để AMITA liên hệ và mời vào nhóm.';
      return e;
    };
    const errs = chk(form), show = st.tried;
    const fe = {};
    ['name', 'email', 'phone', 'role', 'consent'].forEach(k => { fe[k] = show ? errs[k] : ''; fe[k + 'On'] = !!(show && errs[k]); });
    const zaloUrl = P.zaloUrl || 'https://zalo.me/g/MA-NHOM';
    if (this._qrFor !== zaloUrl) {
      this._qrFor = zaloUrl;
      try { const q = window.qrcode(0, 'M'); q.addData(zaloUrl); q.make(); this._qr = q.createDataURL(6, 2); } catch (err) { this._qr = ''; }
    }
    const submit = e => {
      if (e && e.preventDefault) e.preventDefault();
      const f = this.state.form, er = chk(f);
      const first = ['name', 'email', 'phone', 'role', 'consent'].find(k => er[k]);
      if (first) {
        this.setState({ tried: true });
        const el = document.getElementById({ name: 'f-name', email: 'f-email', phone: 'f-phone', role: 'f-biz', consent: 'f-ok' }[first]);
        if (el && first !== 'role') try { el.focus(); } catch (x) {}
        return;
      }
      if (this.state.sending) return;
      const done = demo => this.setState({ sending: false, reg: true, demo: demo, tried: false, doneName: String(f.name).trim() });
      if (f.website) { done(false); return; }
      const q = new URLSearchParams(location.search);
      const payload = {
        name: String(f.name).trim(), email: String(f.email).trim().toLowerCase(), phone: normPhone(f.phone),
        role: f.role, biz: String(f.biz || '').trim(), consent: 'Đồng ý',
        utm_source: q.get('utm_source') || '', utm_medium: q.get('utm_medium') || '', utm_campaign: q.get('utm_campaign') || '',
        page: location.origin + location.pathname, website: f.website || ''
      };
      const url = P.sheetUrl;
      this.setState({ sending: true, err: '' });
      if (!url) { setTimeout(() => done(true), 600); return; }
      fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(() => done(false))
        .catch(() => this.setState({ sending: false, err: 'Chưa gửi được đăng ký. Anh chị kiểm tra kết nối mạng rồi bấm đăng ký lại.' }));
    };
    return {
      dark: dark, light: !dark, themeCls: dark ? 'dark' : 'light', phoneCls: phone ? 'is-phone' : '',
      themeLabel: dark ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối',
      toggleDark: () => this.setState({ dark: !dark }),
      phone: phone, desk: !phone,
      showAll: section === 'all', showCalc: section === 'all' || section === 'calc', showReg: section === 'all' || section === 'register',
      isBasic: mode !== 'pro', isPro: mode === 'pro',
      modeBasicCls: mode !== 'pro' ? 'seg on' : 'seg', modeProCls: mode === 'pro' ? 'seg on' : 'seg',
      modeBasicPressed: mode !== 'pro' ? 'true' : 'false', modeProPressed: mode === 'pro' ? 'true' : 'false',
      setBasic: () => this.setState({ mode: 'basic' }), setPro: () => this.setState({ mode: 'pro' }),
      tndnOpts: tndnOpts, vatOpts: vatOpts, vatLabel: st.vat + '%',
      dt2026: st.dt2026 > 0 ? this.f(st.dt2026) : '',
      setDt2026: e => this.setState({ dt2026: this.dig(e.target.value) }),
      inPct: String(st.inPct), setInPct: e => this.setState({ inPct: Math.min(this.dig(e.target.value), 100) }),
      days: st.days > 0 ? String(st.days) : '', daysN: String(days), setDays: e => this.setState({ days: Math.min(this.dig(e.target.value), 31) }),
      fw: fw, mapEx: mapEx, procGroups: procGroups, trainGroups: trainGroups, dmoGroups: dmoGroups, rep: rep,
      printReport: () => { try { window.print(); } catch (err) {} },
      hint: hint, inds: inds, prows: prows, k: k, b02: b02, per: per, tndnLabel: rateKnown ? rate + '%' : '–', rateAria: rateKnown ? 'Thuế suất TNDN tự động: ' + rate + '%' : 'Thuế suất TNDN chưa xác định được',
      addDisabled: st.products.length >= 5,
      addProduct: () => {
        const ps = this.state.products;
        if (ps.length >= 5) return;
        this.setState({ products: ps.concat([{ id: this.state.nextId, name: 'Sản phẩm ' + (ps.length + 1), lnst: 0, ind: 'tu', pct: 65, price: 0, gv: 50, bh: 8 }]), nextId: this.state.nextId + 1 });
      },
      prodCount: st.products.length + ' / 5 sản phẩm',
      guideOpen: !!st.guideOpen, guideOpenS: st.guideOpen ? 'true' : 'false', guideBtn: st.guideOpen ? 'Ẩn hướng dẫn' : 'Xem hướng dẫn',
      toggleGuide: () => this.setState({ guideOpen: !this.state.guideOpen }),
      mapReadOpen: !!st.mapReadOpen, mapReadOpenS: st.mapReadOpen ? 'true' : 'false', mapReadBtn: st.mapReadOpen ? 'Ẩn hướng dẫn' : 'Xem hướng dẫn',
      toggleMapRead: () => this.setState({ mapReadOpen: !this.state.mapReadOpen }),
      hasAuto: !!autoText, autoText: autoText, hasBad: badAny, badText: badText,
      setTarget: e => {
        // Ô lãi sau thuế ở đầu trang = tổng lãi các sản phẩm; sửa thì chia cho từng sản phẩm theo tỷ trọng đang có
        const x = this.dig(e.target.value), M = this.state.period !== 'month' ? x / 12 : x;
        const ps = this.state.products, S0 = ps.reduce((a, q) => a + q.lnst, 0), ids = ps.map(q => q.id).join();
        let w;
        if (S0 > 0) { w = ps.map(q => q.lnst / S0); this._mix = { ids, w }; }
        else if (this._mix && this._mix.ids === ids) w = this._mix.w;
        else w = ps.map(() => 1 / ps.length);
        this.setState({ products: ps.map((q, i) => Object.assign({}, q, { lnst: M * w[i] })) });
      },
      b02m: b02m, b02h: b02h, vatYearF: this.f(vatYm), qNotes: qNotes,
      rel: !!st.rel, toggleRel: () => this.setState({ rel: !this.state.rel }), vat8: st.vat === 8, notVat8: st.vat !== 8,
      vatCells: vatCells, monthHeads: monthHeads, seasonCells: seasonCells, lockNote: 'Khóa ' + nLocked + '/12', lockWarn: lockWarn, hasLockWarn: !!lockWarn, qrows: qrows,
      form: form, fs: fs, roles: roles, fe: fe,
      toggleConsent: () => this.setState({ form: Object.assign({}, this.state.form, { consent: !this.state.form.consent }), err: '' }),
      submit: submit, err: st.err, hasErr: !!st.err, sending: !!st.sending,
      submitLabel: st.sending ? 'Đang gửi…' : 'Đăng ký vào nhóm',
      reg: reg, notReg: !reg, demo: !!st.demo, doneName: st.doneName || 'anh chị', qrSrc: this._qr || '',
      again: () => this.setState({ reg: false, demo: false, tried: false, err: '',
        form: { name: '', email: '', phone: '', role: '', biz: this.state.form.biz, website: '', consent: false } }),
      zaloUrl: zaloUrl
    };
  }
}

<script>
(function () {
  var C = window.BDCL_CONFIG || {};
  var mq = window.matchMedia('(max-width: 760px)');
  var app = mountDC(Component, document.getElementById('tpl'), document.getElementById('app'), {
    zaloUrl: C.zaloUrl, sheetUrl: C.sheetUrl, phone: mq.matches, section: 'all'

  var onMq = function () { app.setProps({ phone: mq.matches }); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);
  window.__bdcl = app;
